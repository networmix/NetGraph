site_name: NetGraph
site_url: https://networmix.github.io/NetGraph/
repo_url: https://github.com/networmix/NetGraph
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - sane_lists
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences  # <-- enables nested fences
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Tutorial: getting-started/tutorial.md
  - How NetGraph computes: concepts.md
  - Examples:
      - Basic Example: examples/basic.md
      - Clos Fabric: examples/clos-fabric.md
      - Bundled Scenarios: examples/bundled-scenarios.md
  - Reference:
      - Scenario YAML: reference/dsl.md
      - Workflow Steps: reference/workflow.md
      - Command Line: reference/cli.md
      - Results: reference/results.md
      - Python API: reference/api.md
      - Python API (generated): reference/api-full.md
      - Schemas: reference/schemas.md
      - Architecture: reference/design.md
plugins:
  - search
exclude_docs: |
  /design/
strict: true
validation:
  anchors: warn
