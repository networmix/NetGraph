# A backbone of five metros with two PoPs each: a Clos fabric of 16 leaves and 4 spines
# per PoP in three metros, one core router per PoP in the other two, and a DC region in
# each Clos metro. Links join the PoPs of a metro, each DC to its metro's PoPs, and the
# metros along corridors. Nodes and link ends carry hardware from the components library.
# One risk group per adjacency (a corridor, a metro's PoP links, a metro's DC links) is
# generated from the links' adjacency_id. The workflow reports network statistics, finds
# the maximum supported demand of the DC-to-DC traffic matrix, places it at that
# multiplier under 1000 draws of a weighted multi-mode failure policy with cost reports,
# and totals capex and power per metro and per PoP.
seed: 42
blueprints:
  Clos_L16_S4:
    nodes:
      spine:
        count: 4
        template: spine{n}
        attrs:
          role: spine
          hardware:
            component: SpineRouter
            count: 1
      leaf:
        count: 16
        template: leaf{n}
        attrs:
          role: leaf
          hardware:
            component: LeafRouter
            count: 1
    links:
      - source: /leaf
        target: /spine
        pattern: mesh
        capacity: 3200
        cost: 1
        attrs:
          link_type: leaf_spine
          hardware:
            source:
              component: 800G-DR4
              count: 4.0
            target:
              component: 1600G-2xDR4
              count: 2.0
  DCRegion:
    nodes:
      dc:
        count: 1
        template: dc
        attrs:
          role: dc
  SingleRouter:
    nodes:
      core:
        count: 1
        template: core
        attrs:
          role: core
          hardware:
            component: CoreRouter
            count: 1
