risk_groups:
  - generate:
      scope: link
      group_by: adjacency_id
      name: corridor_risk_${value}
      attrs:
        type: corridor_risk
        generated: true
failures:
  weighted_modes:
    attrs:
      description: One risk group, three DC-to-PoP links, one PoP node, or four leaf-spine links
    modes:
      - weight: 0.3
        rules:
          - scope: risk_group
            mode: choice
            count: 1
      - weight: 0.35
        rules:
          - scope: link
            mode: choice
            count: 3
            match:
              conditions:
                - attr: link_type
                  op: ==
                  value: dc_to_pop
              logic: and
            weight_by: target_capacity
      - weight: 0.25
        rules:
          - scope: node
            mode: choice
            count: 1
            match:
              conditions:
                - attr: node_type
                  op: "!="
                  value: dc_region
              logic: and
      - weight: 0.1
        rules:
          - scope: link
            mode: choice
            count: 4
            match:
              conditions:
                - attr: link_type
                  op: ==
                  value: leaf_spine
demands:
  baseline_traffic_matrix:
    - source: ^metro1/dc1/.*
      target: ^metro2/dc1/.*
      mode: pairwise
      volume: 15000.0
      preset: TE_MAXFLOW_UNLIM
    - source: ^metro2/dc1/.*
      target: ^metro1/dc1/.*
      mode: pairwise
      volume: 15000.0
      preset: TE_MAXFLOW_UNLIM
    - source: ^metro1/dc1/.*
      target: ^metro5/dc1/.*
      mode: pairwise
      volume: 15000.0
      preset: TE_MAXFLOW_UNLIM
    - source: ^metro5/dc1/.*
      target: ^metro1/dc1/.*
      mode: pairwise
      volume: 15000.0
      preset: TE_MAXFLOW_UNLIM
    - source: ^metro2/dc1/.*
      target: ^metro5/dc1/.*
      mode: pairwise
      volume: 15000.0
      preset: TE_MAXFLOW_UNLIM
    - source: ^metro5/dc1/.*
      target: ^metro2/dc1/.*
      mode: pairwise
      volume: 15000.0
      preset: TE_MAXFLOW_UNLIM
workflow:
  - type: NetworkStats
    name: network_statistics
  - type: MaximumSupportedDemand
    name: msd_baseline
    demand_set: baseline_traffic_matrix
    alpha_min: 0.001
    alpha_max: 1000000.0
    alpha_tolerance: 0.05
    max_bracket_iters: 16
  - type: TrafficMatrixPlacement
    name: tm_placement
    seed: 42
    demand_set: baseline_traffic_matrix
    failure_policy: weighted_modes
    iterations: 1000
    outputs: {cost_distribution: true}
    alpha_from_step: msd_baseline
  - type: CostPower
    name: cost_power
    include_disabled: true
    aggregation_level: 2
