# The NSFNET T3 backbone in mid-1992, as Merit's map "New T3 Backbone Service, 1992"
# and its node list of 22 May 1992 show it: 12 core sites at MCI junctions joined by 15
# connections, and 16 end sites, each on a single circuit to its core site. Every 1992
# circuit was a DS-3 (44736 kbit/s; capacities here are in kbit/s), and every circuit
# has cost 1, the routing metric all of them had. Modelling choice: each core connection
# is a pair of parallel circuits of half a DS-3 each, the pair in its own risk group.
# The workflow computes the capacity between every pair of sites under each failure
# policy: one random circuit per draw, one random core connection (both circuits of
# its pair) per draw, and independent random circuit and site failures at assumed rates.
