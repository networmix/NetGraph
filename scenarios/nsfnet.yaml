failures:
  single_link_failure:
    attrs:
      description: Fails one random circuit per draw; on a core connection, one of its two circuits
    modes:
      - weight: 1.0
        rules:
          - scope: link
            mode: choice
            count: 1
  single_connection_failure:
    attrs:
      description: Fails one random core connection per draw, both circuits of its pair (the loss of its 1992 DS-3)
    modes:
      - weight: 1.0
        rules:
          - scope: risk_group
            mode: choice
            count: 1
  assumed_random_failures:
    attrs:
      description: >-
        Assumed rates, not taken from a 1992 source: in each draw every circuit fails
        independently with probability 0.001 and every site with probability 0.0005.
    modes:
      - weight: 1.0
        rules:
          - scope: link
            mode: random
            probability: 0.001
          - scope: node
            mode: random
            probability: 0.0005
workflow:
  - type: MaxFlow
    name: node_to_node_capacity_matrix_1
    source: ^(.+)$
    target: ^(.+)$
    mode: pairwise
    failure_policy: single_link_failure
    iterations: 1000
    workers: 8
    seed: 42
    failure_trace: true
    outputs: {cost_distribution: true, min_cut: true}
  - type: MaxFlow
    name: node_to_node_capacity_matrix_2
    source: ^(.+)$
    target: ^(.+)$
    mode: pairwise
    failure_policy: assumed_random_failures
    iterations: 1000
    workers: 8
    seed: 42
    failure_trace: true
    outputs: {cost_distribution: true, min_cut: true}
  - type: MaxFlow
    name: node_to_node_capacity_matrix_3
    source: ^(.+)$
    target: ^(.+)$
    mode: pairwise
    failure_policy: single_connection_failure
    iterations: 1000
    workers: 8
    seed: 42
    failure_trace: true
    outputs: {cost_distribution: true, min_cut: true}
